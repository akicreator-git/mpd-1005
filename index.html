<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MBANK</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MBANK">
<meta name="application-name" content="MBANK">
<meta name="theme-color" content="#EFF0F1">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
@font-face{font-family:"Nunito";font-style:normal;font-weight:200 1000;font-display:block;
  src:url(assets/fonts/nunito-cyr.woff2) format("woff2");
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Nunito";font-style:normal;font-weight:200 1000;font-display:block;
  src:url(assets/fonts/nunito-lat.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --home-bg:#EFF0F1; --ink:#111622; --green:#129958; --yellow:#FFDD2D;
  --u:0.5px; --s:0.5px; --sw:360px; --sh:800px; --sx:0px; --oy:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#EFF0F1;overscroll-behavior:none}
body{font-family:"Nunito",-apple-system,system-ui,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  -webkit-text-size-adjust:100%}
img{-webkit-user-drag:none;-webkit-touch-callout:none;pointer-events:none;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}

#tint{position:fixed;left:0;right:0;top:0;height:1px;z-index:100;pointer-events:none;background:#EFF0F1}

/* ---------- screens ---------- */
.screen{position:fixed;left:0;top:0;width:100%;height:var(--app-h,100%);overflow:hidden;opacity:0;visibility:hidden;
  transition:opacity .35s ease,visibility 0s linear .35s;z-index:1}
.screen.on{opacity:1;visibility:visible;transition:opacity .35s ease,visibility 0s;z-index:2}
.noanim .screen,.noanim .screen *{transition:none!important;animation:none!important}

/* full-bleed 720x1600 artboard, scaled to cover the viewport */
.stage{position:absolute;width:var(--sw);height:var(--sh);left:var(--sx);top:calc(var(--oy) * var(--a,.5))}
.stage > .bg{position:absolute;inset:0;width:100%;height:100%}
.at{position:absolute}

/* ---------- home ---------- */
#home{background:var(--home-bg)}
#home .scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-top:env(safe-area-inset-top);padding-bottom:calc(var(--u) * 170)}
#home .content{position:relative;width:100%;height:calc(var(--u) * 2136)}
#home .content > .bg{width:100%;height:100%}
#home .tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u) * 170);z-index:3}
#home .tabbar img{width:100%;height:100%}

.hdr{position:absolute;left:calc(var(--u) * 18);top:calc(var(--u) * 2);height:calc(var(--u) * 92);
  width:calc(var(--u) * 540);border-radius:calc(var(--u) * 46)}
.hdr .name{position:absolute;left:calc(var(--u) * 119);top:50%;transform:translateY(-52%);
  display:flex;align-items:center;gap:calc(var(--u) * 20);white-space:nowrap;
  font-weight:900;font-size:calc(var(--u) * 61);letter-spacing:calc(var(--u) * -0.6);line-height:1;color:var(--ink)}
.hdr .name svg{width:calc(var(--u) * 20);height:calc(var(--u) * 34);flex:none;margin-top:calc(var(--u) * 4)}
.hdr:active .name{opacity:.6}
.avatar{position:absolute;left:calc(var(--u) * 32);top:calc(var(--u) * 7);width:calc(var(--u) * 80);height:calc(var(--u) * 80);
  border-radius:50%;overflow:hidden;pointer-events:none}
.avatar svg{width:100%;height:100%;display:block}

.start{position:absolute;left:calc(var(--u) * 420);top:calc(var(--u) * 568);width:calc(var(--u) * 121);
  height:calc(var(--u) * 52);border-radius:calc(var(--u) * 26)}
.start::before{content:"";position:absolute;inset:calc(var(--u) * -14);border-radius:inherit}
.start .press{position:absolute;inset:0;border-radius:inherit;background:#000;opacity:0;transition:opacity .12s}
.start:active .press{opacity:.14}
.start .load{position:absolute;inset:0;border-radius:inherit;background:var(--green);display:none;
  align-items:center;justify-content:center}
.start.busy .load{display:flex}
.spin{width:calc(var(--u) * 30);height:calc(var(--u) * 30);border-radius:50%;
  border:calc(var(--u) * 4) solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- preloader ---------- */
#preloader{background:#8c86b8}
.bar{left:calc(var(--s) * 106);top:calc(var(--s) * 1366);width:calc(var(--s) * 508);height:calc(var(--s) * 36);
  border-radius:calc(var(--s) * 18);background:#fff;overflow:hidden;
  box-shadow:inset 0 calc(var(--s) * -3) calc(var(--s) * 4) rgba(0,0,0,.08),0 calc(var(--s) * 2) calc(var(--s) * 10) rgba(0,0,0,.12)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:7%;border-radius:inherit;
  background:linear-gradient(180deg,#FFE84A 0%,#FFD21C 55%,#F6C000 100%);
  box-shadow:inset 0 calc(var(--s) * 3) calc(var(--s) * 3) rgba(255,255,255,.55),inset 0 calc(var(--s) * -3) calc(var(--s) * 3) rgba(214,150,0,.35)}

/* ---------- yellow CTA (same geometry as "Выбрать приз") ---------- */
.cta{left:calc(var(--s) * 32);top:calc(var(--s) * 1392);width:calc(var(--s) * 656);height:calc(var(--s) * 95);
  border-radius:calc(var(--s) * 30);background:var(--yellow);color:var(--ink);
  font-weight:800;font-size:calc(var(--s) * 35);letter-spacing:calc(var(--s) * -0.2);
  display:flex;align-items:center;justify-content:center;transition:scale .14s ease,filter .14s ease}
/* `scale` (not transform), so the entrance animation on transform can't swallow the press effect */
.cta:active,.cta.pressed{scale:.95;filter:brightness(.9)}

/* ---------- pay ---------- */
#pay{background:#06583d}
#pay .stage{top:var(--gt,0px);background:
  radial-gradient(120% 60% at 15% 45%,rgba(30,190,120,.45),transparent 60%),
  radial-gradient(90% 50% at 90% 20%,rgba(0,60,40,.55),transparent 70%),
  linear-gradient(180deg,#024f35 0%,#07875a 42%,#0a8f60 55%,#07714f 80%,#06583f 100%)}

/* ---------- video ---------- */
#video{background:#000}
#video video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#13a05a}

/* ---------- prize ---------- */
#prize{background:#05593d}
#prize .stage{top:var(--gt,0px)}
#prize.on .stage > .bg{animation:zoomIn .55s cubic-bezier(.2,.8,.2,1) both}
#prize.on .cta{animation:rise .6s cubic-bezier(.2,1.25,.4,1) .35s both}
.back{left:calc(var(--s) * 26);top:calc(var(--s) * 130);width:calc(var(--s) * 92);height:calc(var(--s) * 92);border-radius:50%}
.back:active{background:rgba(0,0,0,.12)}
@keyframes zoomIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(160%)}to{opacity:1;transform:none}}

/* ---------- cards ---------- */
#cards{background:#0a3d33}
#cards .stage{top:var(--gt,0px)}
.title{left:calc(var(--s) * 24);right:calc(var(--s) * 24);top:calc(var(--s) * 452);text-align:center;color:#fff;font-weight:800;
  font-size:calc(var(--s) * 36);letter-spacing:calc(var(--s) * -0.3)}
.card{top:calc(var(--s) * 590);width:calc(var(--s) * 208);height:calc(var(--s) * 284);
  border-radius:calc(var(--s) * 28);background:#fff;
  box-shadow:0 calc(var(--s) * 10) calc(var(--s) * 30) rgba(0,0,0,.18);
  transition:transform .35s cubic-bezier(.2,1.3,.4,1),box-shadow .35s}
.card .in{position:absolute;inset:0;border-radius:inherit;overflow:hidden;
  background:radial-gradient(circle at 50% 40%,rgba(255,232,120,.85) 0,rgba(255,240,170,.55) 22%,rgba(255,250,225,.2) 40%,rgba(255,255,255,0) 55%)}
.card img{position:absolute;left:50%;top:calc(var(--s) * 112);width:calc(var(--s) * 160);height:calc(var(--s) * 160);
  transform:translate(-50%,-50%);filter:drop-shadow(0 calc(var(--s) * 6) calc(var(--s) * 8) rgba(0,0,0,.18))}
.card span{position:absolute;left:calc(var(--s) * 10);right:calc(var(--s) * 10);bottom:calc(var(--s) * 26);
  min-height:calc(var(--s) * 56);display:flex;align-items:center;justify-content:center;text-align:center;
  font-weight:700;font-size:calc(var(--s) * 24);line-height:1.15;color:#1b1f27}
.card.c0{left:calc(var(--s) * 32)} .card.c1{left:calc(var(--s) * 256)} .card.c2{left:calc(var(--s) * 480)}
.card.sel{transform:translateY(calc(var(--s) * -32));box-shadow:0 calc(var(--s) * 18) calc(var(--s) * 40) rgba(0,0,0,.28)}
.card:active .in{background-color:rgba(0,0,0,.03)}
#cardRow.nudge .card .in{animation:nudge .45s ease}
.card.gone{visibility:hidden}
@keyframes nudge{30%{transform:translateY(calc(var(--s) * -18))}60%{transform:translateY(calc(var(--s) * 4))}}

/* ---------- won prize, full screen ---------- */
#win{position:fixed;left:0;top:0;width:100%;height:var(--app-h,100%);z-index:40;display:none}
#win.on{display:block}
#win.out{opacity:0;transition:opacity .35s ease}
.wcard{position:absolute;overflow:hidden;background:#fff;
  transition:left .55s cubic-bezier(.3,1,.3,1),top .55s cubic-bezier(.3,1,.3,1),width .55s cubic-bezier(.3,1,.3,1),
    height .55s cubic-bezier(.3,1,.3,1),border-radius .55s ease}
.wcard .glow{position:absolute;inset:0;
  background:radial-gradient(circle at 50% 40%,rgba(255,232,120,.85) 0,rgba(255,240,170,.55) 22%,rgba(255,250,225,.2) 40%,rgba(255,255,255,0) 55%)}
.wcard .rays{position:absolute;left:50%;top:40%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;opacity:0;
  background:repeating-conic-gradient(rgba(255,206,40,.16) 0deg 7deg,rgba(255,206,40,0) 7deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,#000 18%,transparent 42%);mask:radial-gradient(circle,#000 0,#000 18%,transparent 42%);
  transition:opacity .6s ease .35s;animation:spin 40s linear infinite}
.wcard img{position:absolute;left:50%;top:40%;width:77%;transform:translate(-50%,-50%);
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.2))}
.wcard .wname{position:absolute;left:24px;right:24px;bottom:24%;text-align:center;opacity:0;transform:translateY(16px);
  font-weight:900;font-size:32px;line-height:1.1;letter-spacing:-.3px;color:#1b1f27;
  transition:opacity .4s ease .4s,transform .5s cubic-bezier(.2,1.3,.4,1) .4s}
#win.open .rays{opacity:1}
#win.open .wname{opacity:1;transform:none}
#cards.on .title{animation:fadeDown .5s ease both}
#cards.on .card .pop{animation:pop .55s cubic-bezier(.2,1.35,.4,1) both}
#cards.on .card.c0 .pop{animation-delay:.1s} #cards.on .card.c1 .pop{animation-delay:.2s} #cards.on .card.c2 .pop{animation-delay:.3s}
.card .pop{position:absolute;inset:0;border-radius:inherit}
#cards.on .cta{animation:rise .6s cubic-bezier(.2,1.25,.4,1) .45s both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-30%)}to{opacity:1;transform:none}}
.spark{width:calc(var(--s) * 40);height:calc(var(--s) * 40);margin:calc(var(--s) * -20) 0 0 calc(var(--s) * -20);
  animation:tw 2.4s ease-in-out infinite}
.spark svg{width:100%;height:100%;filter:drop-shadow(0 0 calc(var(--s) * 8) rgba(255,255,220,.9))}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}

/* ---------- admin ---------- */
#admin{position:fixed;left:0;top:0;width:100%;height:var(--app-h,100%);z-index:50;display:none}
#admin.on{display:block}
#admin .dim{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fade .2s both}
#admin .sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:#fff;
  border-radius:20px 20px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));
  animation:up .28s cubic-bezier(.2,.9,.3,1) both;-webkit-user-select:text;user-select:text}
#admin .grab{width:40px;height:5px;border-radius:3px;background:#d5d7db;margin:0 auto 12px}
#admin h3{margin:0 0 4px;font-size:20px;font-weight:900}
#admin .hint{margin:0 0 12px;color:#8a8f98;font-size:13px;font-weight:600}
#admin .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin:0 0 8px;
  border-radius:14px;background:#f2f3f5;border:2px solid transparent}
#admin .opt.sel{border-color:var(--green);background:#eaf7f0}
#admin .opt b{display:block;font-size:17px;font-weight:800}
#admin .opt small{display:block;color:#6b717c;font-size:13px;font-weight:600;margin-top:2px}
#admin .opt .ck{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid #c9ccd2;flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:900}
#admin .opt.sel .ck{background:var(--green);border-color:var(--green)}
#admin label{display:block;margin:14px 0 6px;font-size:13px;font-weight:700;color:#6b717c}
#admin input{width:100%;font:inherit;font-size:17px;font-weight:700;padding:12px 14px;border-radius:12px;
  border:2px solid #e1e3e7;outline:none;-webkit-user-select:text;user-select:text}
#admin input:focus{border-color:var(--green)}
#admin .ver{margin:12px 0 0;text-align:center;color:#a3a8b0;font-size:12px;font-weight:600}
#admin .done{width:100%;margin-top:14px;padding:15px;border-radius:14px;background:var(--green);color:#fff;font-size:17px;font-weight:800}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
</style>
</head>
<body>
<div id="tint"></div>

<!-- 1. Главная -->
<section class="screen on" id="home">
  <div class="scroll" id="homeScroll">
    <div class="content">
      <img class="bg" src="assets/home.jpg" alt="">
      <div class="avatar"><svg viewBox="0 0 80 80"><defs><linearGradient id="avg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CBD0D7"/><stop offset="1" stop-color="#A9B0BA"/></linearGradient></defs><rect width="80" height="80" fill="url(#avg)"/><circle cx="40" cy="31" r="14.5" fill="#fff"/><path d="M11 82c0-17.5 13-28 29-28s29 10.5 29 28z" fill="#fff"/></svg></div>
      <button class="hdr" id="nameBtn" aria-label="Сценарий">
        <span class="name"><span id="userName">Александр</span>
          <svg viewBox="0 0 20 34" fill="none"><path d="M4 4l12 13L4 30" stroke="#111622" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>
      <button class="start" id="startBtn" aria-label="Начать"><span class="press"></span><span class="load"><span class="spin"></span></span></button>
    </div>
  </div>
  <div class="tabbar"><img src="assets/tabbar.png" alt=""></div>
</section>

<!-- 2. Загрузка -->
<section class="screen" id="preloader">
  <div class="stage">
    <img class="bg" src="assets/preloader.jpg" alt="">
    <div class="at bar"><i id="barFill"></i></div>
  </div>
</section>

<!-- 3. Оплатить -->
<section class="screen" id="pay">
  <div class="stage">
    <button class="at cta" id="payBtn">Оплатить</button>
  </div>
</section>

<!-- 4. Видео MPay -->
<section class="screen" id="video">
  <video id="vid" playsinline webkit-playsinline preload="auto" disablepictureinpicture disableremoteplayback src="assets/mpay.mp4"></video>
</section>

<!-- 5. Выберите приз -->
<section class="screen" id="prize">
  <div class="stage">
    <img class="bg" src="assets/prize.jpg" alt="">
    <button class="at back" id="backBtn" aria-label="Назад"></button>
    <button class="at cta" id="choose">Выбрать приз</button>
  </div>
</section>

<!-- 6. Карточки призов -->
<section class="screen" id="cards">
  <div class="stage">
    <img class="bg" src="assets/cards-bg.jpg" alt="">
    <div class="at spark" style="left:calc(var(--s)*70);top:calc(var(--s)*392)"><svg viewBox="0 0 40 40"><path d="M20 0C21.5 13 27 18.5 40 20 27 21.5 21.5 27 20 40 18.5 27 13 21.5 0 20 13 18.5 18.5 13 20 0Z" fill="#FFFDE8"/></svg></div>
    <div class="at spark" style="left:calc(var(--s)*450);top:calc(var(--s)*350);transform:scale(.6);animation-delay:.8s;width:calc(var(--s)*26);height:calc(var(--s)*26)"><svg viewBox="0 0 40 40"><path d="M20 0C21.5 13 27 18.5 40 20 27 21.5 21.5 27 20 40 18.5 27 13 21.5 0 20 13 18.5 18.5 13 20 0Z" fill="#FFFDE8"/></svg></div>
    <div class="at spark" style="left:calc(var(--s)*626);top:calc(var(--s)*558);animation-delay:1.4s;width:calc(var(--s)*28);height:calc(var(--s)*28)"><svg viewBox="0 0 40 40"><path d="M20 0C21.5 13 27 18.5 40 20 27 21.5 21.5 27 20 40 18.5 27 13 21.5 0 20 13 18.5 18.5 13 20 0Z" fill="#FFFDE8"/></svg></div>
    <div class="at spark" style="left:calc(var(--s)*120);top:calc(var(--s)*1010);animation-delay:.4s;width:calc(var(--s)*22);height:calc(var(--s)*22)"><svg viewBox="0 0 40 40"><path d="M20 0C21.5 13 27 18.5 40 20 27 21.5 21.5 27 20 40 18.5 27 13 21.5 0 20 13 18.5 18.5 13 20 0Z" fill="#FFFDE8"/></svg></div>
    <div class="at title">Мани достаточно для обмена</div>
    <div id="cardRow"></div>
    <button class="at cta" id="exchange">Обменять</button>
  </div>
</section>

<!-- 7. Выбранный приз на весь экран (тап → всё заново) -->
<div id="win">
  <div class="wcard" id="wcard">
    <div class="glow"></div>
    <div class="rays"></div>
    <img id="wimg" alt="">
    <div class="wname" id="wname"></div>
  </div>
</div>

<!-- Админ-панель -->
<div id="admin">
  <div class="dim" id="adminDim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <h3>Сценарий</h3>
    <p class="hint">Выбор сохраняется на телефоне, даже если приложение закрыть.</p>
    <div id="optList"></div>
    <label for="nameInput">Имя пользователя для этого сценария</label>
    <input id="nameInput" type="text" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="24">
    <button class="done" id="adminDone">Готово</button>
    <p class="ver" id="ver"></p>
  </div>
</div>

<script>
/* ===== Настройки прототипа ===== */
const CONFIG = {
  startDelay: 0,          // мс: спиннер на кнопке «Начать» перед экраном загрузки (0 = сразу)
  loadDuration: 2000,     // мс: сколько ползунок едет до конца
  afterLoad: 250,         // мс: пауза на 100% перед экраном «Оплатить»
};

const PRIZES = {
  console:    'Игровая приставка',
  phone:      'Смартфон',
  speaker:    'Колонка',
  headphones: 'Наушники',
  watch:      'Смарт-часы',
  camera:     'Камера',
  laptop:     'Ноутбук',
  coffee:     'Кофемашина',
  vacuum:     'Робот-пылесос',
  tv:         'Телевизор',
  chair:      'Массажное кресло',
};

const SCENARIOS = [
  { id: 'alpha',      title: 'Альфа',         name: 'Александр', prizes: ['console', 'phone', 'speaker'] },
  { id: 'zoomer',     title: 'Зумер',         name: 'Александр', prizes: ['headphones', 'speaker', 'watch'] },
  { id: 'millennial', title: 'Миллениал',     name: 'Александр', prizes: ['camera', 'phone', 'laptop'] },
  { id: 'genx',       title: 'Поколение X',   name: 'Александр', prizes: ['phone', 'coffee', 'vacuum'] },
  { id: 'boomer',     title: 'Бейби-Бумеры',  name: 'Александр', prizes: ['tv', 'chair', 'phone'] },
];

/* ===== Состояние (localStorage, переживает сворачивание и перезапуск) ===== */
const BUILD = 9;   // номер версии — виден внизу админки
const KEY = 'moneypoly-proto-v1';
let state = { scenario: 'alpha', names: {} };
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const scenario = () => SCENARIOS.find(s => s.id === state.scenario) || SCENARIOS[0];
const nameOf = s => (state.names[s.id] || '').trim() || s.name;

const $ = id => document.getElementById(id);

/* ===== Раскладка ===== */
function appHeight() { return window.innerHeight; }
function safeTop() {
  const p = document.createElement('div');
  p.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top)';
  document.body.appendChild(p);
  const v = parseFloat(getComputedStyle(p).paddingTop) || 0;
  p.remove();
  return v;
}
function layout() {
  const W = window.innerWidth, H = appHeight();
  document.documentElement.style.setProperty('--app-h', H + 'px');
  const sw = Math.max(W, H * 720 / 1600), sh = sw * 1600 / 720;
  const r = document.documentElement.style;
  r.setProperty('--u', (W / 750) + 'px');
  r.setProperty('--s', (sw / 720) + 'px');
  r.setProperty('--sw', sw + 'px');
  r.setProperty('--sh', sh + 'px');
  r.setProperty('--sx', ((W - sw) / 2) + 'px');
  r.setProperty('--oy', (H - sh) + 'px');
  // Игровые экраны: если статус-бар системный (страница начинается под ним) — срезаем сверху
  // нарисованный в макете статус-бар (44pt из 800), остальное снизу, но снизу не больше 40px.
  const over = Math.max(0, sh - H);
  let top = safeTop() > 0 ? 0 : Math.min(over, 44 * sh / 800);
  if (over - top > 40) top = over - 40;
  r.setProperty('--gt', (-top) + 'px');
  fitName();
}
function fitName() {
  const el = $('userName').parentElement;
  el.style.fontSize = '';
  const max = (window.innerWidth / 750) * 440;
  const w = el.getBoundingClientRect().width;
  if (w > max) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * max / w) + 'px';
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 300));

/* ===== Сценарий: имя + карточки ===== */
let selected = -1; // ни одна карточка не выбрана, пока герой не нажмёт
function render() {
  const s = scenario();
  $('userName').textContent = nameOf(s);
  fitName();
  $('cardRow').innerHTML = s.prizes.map((p, i) =>
    `<button class="at card c${i}${i === selected ? ' sel' : ''}" data-i="${i}"><div class="pop"><div class="in">` +
    `<img src="assets/prizes/${p}.png" alt=""><span>${PRIZES[p]}</span></div></div></button>`).join('');
}
$('cardRow').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (!c) return;
  selected = +c.dataset.i;
  document.querySelectorAll('.card').forEach(el => el.classList.toggle('sel', +el.dataset.i === selected));
});

/* ===== Навигация ===== */
let current = 'home', timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
// цвет статус-бара на Android под каждый экран (iPhone его игнорирует)
// iOS 26 красит статус-бар не по theme-color, а по фону body / закреплённому элементу у верхнего края —
// поэтому меняем все три источника сразу.
const THEME = { home: '#EFF0F1', preloader: '#9094c5', pay: '#024f35', video: '#1a9f5a', prize: '#035434', cards: '#13382f' };
function setTheme(c) {
  document.querySelector('meta[name="theme-color"]').setAttribute('content', c);
  document.documentElement.style.backgroundColor = c;
  document.body.style.backgroundColor = c;
  $('tint').style.backgroundColor = c;
}
function show(id) {
  if (id === current) return;
  $(current).classList.remove('on');
  $(id).classList.add('on');
  current = id;
  setTheme(THEME[id]);
}

// После видео плеер выгружается целиком — иначе Android держит в шторке/статус-баре значок медиаплеера
let videoSrc = 'assets/mpay.mp4';
function releaseVideo() {
  const v = $('vid');
  try { v.pause(); } catch (e) {}
  if (v.getAttribute('src')) { v.removeAttribute('src'); v.load(); }
}

function goHome(instant) {
  timers.forEach(clearTimeout); timers = [];
  releaseVideo();
  if (instant) document.body.classList.add('noanim');
  show('home');
  $('startBtn').classList.remove('busy');
  $('homeScroll').scrollTop = 0;
  selected = -1; render();
  hideWin(instant);
  if (instant) requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('noanim')));
}

// «Начать» → спиннер → загрузка
$('startBtn').addEventListener('click', () => {
  const b = $('startBtn');
  if (current !== 'home' || b.classList.contains('busy')) return;
  if (CONFIG.startDelay <= 0) return startLoading();
  b.classList.add('busy');
  later(startLoading, CONFIG.startDelay);
});

function startLoading() {
  const fill = $('barFill');
  fill.style.transition = 'none';
  fill.style.width = '7%';
  show('preloader');
  $('startBtn').classList.remove('busy');
  // ползунок едет рывками, как настоящая загрузка
  const D = CONFIG.loadDuration;
  const steps = [[0.08, 22], [0.30, 48], [0.52, 63], [0.72, 86], [1.0, 100]];
  let t0 = 0;
  steps.forEach(([t, w]) => {
    const dur = Math.round((t - t0) * D * 0.9);
    later(() => {
      fill.style.transition = `width ${dur}ms cubic-bezier(.3,.7,.4,1)`;
      fill.style.width = w + '%';
    }, Math.round(t0 * D) + 40);
    t0 = t;
  });
  later(() => show('pay'), D + CONFIG.afterLoad);
}

// «Оплатить» → видео (play() вызывается прямо в обработчике клика, чтобы iOS разрешил звук)
let videoShownAt = 0;
$('payBtn').addEventListener('click', () => {
  const v = $('vid');
  if (v.getAttribute('src') !== videoSrc) v.src = videoSrc;
  try { v.currentTime = 0; } catch (e) {}
  v.muted = false;
  const p = v.play();
  if (p && p.catch) p.catch(() => { v.muted = true; v.play().catch(() => {}); });
  videoShownAt = Date.now();
  show('video');
});
function closeVideo() {
  if (current !== 'video') return;
  const v = $('vid'); v.pause();
  show('prize');
  setTimeout(() => { if (current !== 'video') releaseVideo(); }, 450); // после того как экран видео погаснет
}
$('video').addEventListener('click', () => { if (Date.now() - videoShownAt > 400) closeVideo(); });
$('vid').addEventListener('ended', closeVideo);

// «Выбрать приз» → карточки, «<» → главная
$('choose').addEventListener('click', () => { selected = -1; render(); show('cards'); });
$('backBtn').addEventListener('click', () => goHome(false));
// «Обменять» → выбранная карточка раскрывается на весь экран; тап в любом месте → всё заново
let winAt = 0;
$('exchange').addEventListener('click', () => {
  if (current !== 'cards' || $('win').classList.contains('on')) return;
  if (selected < 0) {                       // ничего не выбрано — карточки подпрыгивают
    const row = $('cardRow');
    row.classList.remove('nudge'); void row.offsetWidth; row.classList.add('nudge');
    return;
  }
  const card = document.querySelector(`.card.c${selected}`);
  const r = card.getBoundingClientRect();
  const p = scenario().prizes[selected];
  $('wimg').src = `assets/prizes/${p}.png`;
  $('wname').textContent = PRIZES[p];
  const w = $('win'), c = $('wcard');
  w.className = '';
  c.style.transition = 'none';
  Object.assign(c.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px',
    borderRadius: getComputedStyle(card).borderTopLeftRadius });
  winAt = Date.now();
  later(() => {                              // небольшая пауза, чтобы было видно нажатие кнопки
    w.classList.add('on');
    card.classList.add('gone');
    setTheme('#ffffff');
    void c.offsetWidth;
    c.style.transition = '';
    requestAnimationFrame(() => {
      w.classList.add('open');
      Object.assign(c.style, { left: '0px', top: '0px', width: window.innerWidth + 'px', height: appHeight() + 'px', borderRadius: '0px' });
    });
  }, 160);
});
$('win').addEventListener('click', () => { if (Date.now() - winAt > 900) goHome(false); });
function hideWin(instant) {
  const w = $('win');
  if (!w.classList.contains('on')) return;
  setTheme(THEME[current]);
  if (instant) { w.className = ''; return; }
  w.classList.add('out');
  later(() => { w.className = ''; }, 380);
}

// Нажатие кнопок видно даже при коротком тапе
document.querySelectorAll('.cta').forEach(b => {
  let t = 0;
  const up = () => setTimeout(() => b.classList.remove('pressed'), Math.max(0, 170 - (Date.now() - t)));
  b.addEventListener('pointerdown', () => { t = Date.now(); b.classList.add('pressed'); });
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
});

/* ===== Админ-панель (тап по имени) ===== */
function openAdmin() {
  const s = scenario();
  $('optList').innerHTML = SCENARIOS.map(x =>
    `<button class="opt${x.id === s.id ? ' sel' : ''}" data-id="${x.id}"><div><b>${x.title}</b>` +
    `<small>${nameOf(x)} · ${x.prizes.map(p => PRIZES[p].toLowerCase()).join(', ')}</small></div><span class="ck">✓</span></button>`).join('');
  $('nameInput').value = nameOf(s);
  const bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content;
  $('ver').textContent = `версия ${BUILD} · ${innerWidth}×${innerHeight} · экран ${screen.width}×${screen.height} · ` +
    `safe ${Math.round(safeTop())} · ${navigator.standalone ? 'иконка' : 'браузер'} · бар ${bar}`;
  $('admin').classList.add('on');
}
function closeAdmin() {
  $('nameInput').blur();
  $('admin').classList.remove('on');
}
$('nameBtn').addEventListener('click', openAdmin);
$('optList').addEventListener('click', e => {
  const o = e.target.closest('.opt'); if (!o) return;
  state.scenario = o.dataset.id; save(); render(); openAdmin();
});
$('nameInput').addEventListener('input', e => {
  const s = scenario(), v = e.target.value.trim();
  if (v && v !== s.name) state.names[s.id] = v; else delete state.names[s.id];
  save(); render();
  const small = document.querySelector('.opt.sel small');
  if (small) small.textContent = `${nameOf(s)} · ${s.prizes.map(p => PRIZES[p].toLowerCase()).join(', ')}`;
});
$('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') closeAdmin(); });
$('adminDone').addEventListener('click', closeAdmin);
$('adminDim').addEventListener('click', closeAdmin);

/* ===== Свернули приложение → при возврате всегда главная ===== */
document.addEventListener('visibilitychange', () => { if (document.hidden) { closeAdmin(); goHome(true); } });
window.addEventListener('pagehide', () => goHome(true));
window.addEventListener('pageshow', e => { if (e.persisted) goHome(true); });

/* ===== Предзагрузка ===== */
document.addEventListener('touchstart', () => {}, { passive: true }); // включает :active на iOS
document.addEventListener('gesturestart', e => e.preventDefault());   // без pinch-zoom
document.addEventListener('dblclick', e => e.preventDefault());

function preload() {
  const imgs = ['assets/preloader.jpg', 'assets/prize.jpg', 'assets/cards-bg.jpg']
    .concat(Object.keys(PRIZES).map(p => `assets/prizes/${p}.png`));
  imgs.forEach(src => { const i = new Image(); i.src = src; if (i.decode) i.decode().catch(() => {}); });
  // видео целиком в память → без подгрузки во время дубля
  fetch('assets/mpay.mp4').then(r => r.ok ? r.blob() : Promise.reject())
    .then(b => {
      const v = $('vid');
      videoSrc = URL.createObjectURL(b.type ? b : new Blob([b], { type: 'video/mp4' }));
      if (current === 'video') return;
      v.src = videoSrc;
      v.load();
    }).catch(() => {});
}

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

layout();
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitName);
preload();
</script>
</body>
</html>
